[project]
name = "image_pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.14.0",
    "detectron2",
    "easyocr>=1.7.2",
    "ipykernel>=7.1.0",
    "nbformat>=5.10.4",
    "openai>=2.14.0",
    "opencv-python>=4.12.0.88",
    "openinference-instrumentation-openai>=0.1.41",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3.251219",
    "plotly>=6.6.0",
    "pymupdf>=1.26.7",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "structlog",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "typer",
]

[project.optional-dependencies]
annotation = ["labelme>=5.10.1"]

[tool.uv.sources]
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git" }

[tool.uv.extra-build-dependencies]
detectron2 = ["torch"]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
