[project]
name = "text_pipeline"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adjusttext>=1.3.0",
    "anytree>=2.13.0",
    "arize-phoenix>=12.10.0",
    "dedupe>=3.0.3",
    "ftfy>=6.3.1",
    "graphviz>=0.21",
    "imutils>=0.5.4",
    "ipykernel>=7.0.1",
    "jinja2>=3.1.6",
    "json-repair>=0.53.0",
    "langchain>=1.0.2",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.1",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.1",
    "marker-pdf>=1.10.1",
    "mypy>=1.18.2",
    "numpy>=2.3.4",
    "openinference-instrumentation-langchain>=0.1.54",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.2.250926",
    "pdfplumber>=0.10.0",
    "pydantic-settings>=2.11.0",
    "pymupdf>=1.26.5",
    "pymupdf-stubs",
    "pypdf2>=3.0.1",
    "pypdfium2>=4.30.0",
    "pytest>=8.4.2",
    "python-levenshtein>=0.27.3",
    "requests>=2.32.5",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.2",
    "shap>=0.49.1",
    "statsmodels>=0.14.5",
    "structlog>=25.5.0",
    "textdistance>=4.6.3",
    "tqdm>=4.67.1",
    "typer>=0.24.1",
    "types-requests>=2.32.4.20250913",
    "ultralytics>=8.3.240",
    "zss>=1.2.0",
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = ["-p", "no:warnings"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
